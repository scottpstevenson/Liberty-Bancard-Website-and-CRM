<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A statement, made understandable</title><desc id="desc">Illustrative statement anatomy: interchange, network assessments, processor charges and equipment or recurring fees. No customer figures or results are shown.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F6FA"/><rect x="56" y="52" width="40" height="4" rx="0" fill="#C8102E"/><text x="112" y="62" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#526077" letter-spacing="2">THE STATEMENT REVIEW</text><text x="56" y="120" font-family="IBM Plex Sans, Arial, sans-serif" font-size="39" font-weight="600" fill="#071D57" >Understand what goes into the cost.</text><text x="56" y="157" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526077" >A clear starting point for a conversation about your processing.</text><rect x="56" y="206" width="460" height="516" rx="10" fill="white" stroke="#D8E1EB" stroke-width="2"/><rect x="56" y="206" width="460" height="10" rx="0" fill="#071D57"/><text x="88" y="260" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#071D57" >YOUR PROCESSING STATEMENT</text><text x="88" y="293" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526077" >Illustrative layout · no customer figures</text><rect x="82" y="313" width="404" height="62" rx="4" fill="#F8FAFD"/><text x="96" y="351" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#101C32" >Interchange</text><text x="455" y="351" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526077" >—</text><path d="M486 344 H552 V328 H600" fill="none" stroke="#D8E1EB" stroke-width="2"/><circle cx="486" cy="344" r="4" fill="#174B93"/><rect x="82" y="395" width="404" height="62" rx="4" fill="#F8FAFD"/><text x="96" y="433" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#101C32" >Network assessments</text><text x="455" y="433" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526077" >—</text><path d="M486 426 H552 V410 H600" fill="none" stroke="#D8E1EB" stroke-width="2"/><circle cx="486" cy="426" r="4" fill="#174B93"/><rect x="82" y="477" width="404" height="62" rx="4" fill="#F8FAFD"/><text x="96" y="515" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#101C32" >Processor charges</text><text x="455" y="515" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526077" >—</text><path d="M486 508 H552 V492 H600" fill="none" stroke="#D8E1EB" stroke-width="2"/><circle cx="486" cy="508" r="4" fill="#174B93"/><rect x="82" y="559" width="404" height="62" rx="4" fill="#F8FAFD"/><text x="96" y="597" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#101C32" >Equipment &amp; recurring fees</text><text x="455" y="597" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526077" >—</text><path d="M486 590 H552 V574 H600" fill="none" stroke="#D8E1EB" stroke-width="2"/><circle cx="486" cy="590" r="4" fill="#174B93"/><text x="614" y="332" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#C8102E" >01</text><text x="658" y="332" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#071D57" >Card-issuer fees</text><text x="658" y="361" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#526077" >Identify the interchange entries.</text><text x="614" y="414" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#C8102E" >02</text><text x="658" y="414" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#071D57" >Network charges</text><text x="658" y="443" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#526077" >Separate the assessment entries.</text><text x="614" y="496" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#C8102E" >03</text><text x="658" y="496" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#071D57" >Provider charges</text><text x="658" y="525" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#526077" >Clarify processor and service fees.</text><text x="614" y="578" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#C8102E" >04</text><text x="658" y="578" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="600" fill="#071D57" >Equipment &amp; other costs</text><text x="658" y="607" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#526077" >Review recurring fees and terms.</text><text x="88" y="684" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#526077" >Questions and unknown fees stay visible.</text><text x="56" y="764" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526077" >Illustrative explanation. Your actual statement and applicable terms determine the review.</text></svg>