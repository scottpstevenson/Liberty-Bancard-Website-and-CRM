name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Static job: typecheck + file-scan suites (no DB, no network) ────────────
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical suite manifest
        run: npx tsx scripts/ci-suite-manifest.ts --check

      - name: Run all deterministic static suites
        run: npx tsx scripts/run-ci-suites.ts --capability deterministic-static

  # ── Integration job: DB + Redis; GHL and live providers are blocked ─────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      GHL_TRANSPORT_FAILFAST: "true"
      SUNBIZ_ENRICHMENT_ENABLED: "false"
      SERPER_GATEWAY_ENABLED: "false"
      SESSION_SECRET: ci-test-secret-32chars-minimum-ok
      CREDENTIAL_ENCRYPTION_KEY: ci-test-encryption-key-32chars-ok
      MERCHANT_DATA_ENCRYPTION_KEY: ci-test-merchant-key-32chars-min
      TEST_REDIS_PREFIX: ci_task1664_
      ADMIN_SEED_EMAIL: ci-admin@libertybancard.test
      ADMIN_SEED_PASSWORD: ci-admin-password-Aa1!
      ADMIN_SEED_FORCE_UPDATE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap disposable schema snapshot
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0109_fearless_starhawk.sql

      - name: Run database migrations
        env:
          CI_SNAPSHOT_BOOTSTRAP: "true"
        run: npx tsx server/db-migrate.ts

      - name: Validate canonical suite manifest
        run: npx tsx scripts/ci-suite-manifest.ts --check

      - name: Run all deterministic integration suites
        run: npx tsx scripts/run-ci-suites.ts --capability deterministic-integration

      - name: Start disposable CI application server
        run: |
          npm run dev > ci-server.log 2>&1 &
          echo $! > ci-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "CI server did not become healthy"
          cat ci-server.log
          exit 1

      - name: Run all server-required suites
        run: npx tsx scripts/run-ci-suites.ts --capability server-required

      - name: Stop disposable CI application server
        if: always()
        run: |
          if [ -f ci-server.pid ]; then
            kill "$(cat ci-server.pid)" 2>/dev/null || true
          fi
